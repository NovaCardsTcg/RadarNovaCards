name: radar

on:
  schedule:
    # Se pide un arranque CADA HORA aunque cada ejecucion dure 6 (el maximo de
    # GitHub). No es para que corran varias: es porque GitHub se salta
    # arranques programados a mansalva (medido: 7 cumplidos de 144, y ayer se
    # salto los de las 15, 18 y 06). Pidiendo 24 al dia basta con que entre uno
    # cada seis horas para no dejar hueco.
    - cron: '0 * * * *'
  workflow_dispatch:

# Sin cancel-in-progress, a proposito. Mientras una ejecucion corre, la
# siguiente que GitHub acepte se queda EN COLA y arranca en el mismo instante
# en que la primera termina; los arranques posteriores van sustituyendo a ese
# que espera, asi que nunca hay mas de uno en cola. Resultado: cobertura sin
# cortes mientras GitHub acepte al menos un arranque cada seis horas.
#
# Con cancel-in-progress pasaba lo contrario: si GitHub creaba la ejecucion
# nueva pero tardaba en darle maquina, la vieja moria al instante y el radar
# se quedaba parado justo el rato de la espera.
concurrency:
  group: radar-pokemon
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    # 6 h es el tope duro de GitHub para un job; 355 deja margen para cerrar.
    timeout-minutes: 355
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Recuperar estado de la pasada anterior
        run: |
          # La config de la rama estado guarda lo que se cambia desde Telegram
          # (palabras, tiendas, canal, afiliado...). Pero las listas de filtros
          # se editan en main, y como el job que corre reescribe la rama estado
          # cada 5 minutos con SU config, un cambio de filtros empujado a esa
          # rama se perdia en minutos. Aqui main manda en los filtros y estado
          # en lo demas, y se acabo empujar la misma config a dos ramas.
          cp config.json config.main.json
          git fetch origin estado:estado 2>/dev/null || echo "primera ejecucion: aun no hay rama estado"
          git checkout estado -- estado.json config.json 2>/dev/null || echo "arrancando con la config del repo"
          python - <<'PY'
          import json
          e = json.load(open("config.json", encoding="utf-8"))
          m = json.load(open("config.main.json", encoding="utf-8"))
          for k in ("tematica", "excluir", "excluir_patron", "destacar", "cada_min",
                    "stock_cada_min", "fichas_por_pasada", "pasadas_confirmar",
                    "horas_candidato", "rodaje_pasadas", "max_nuevos_pasada"):
              if k in m:
                  e[k] = m[k]
          json.dump(e, open("config.json", "w", encoding="utf-8"),
                    ensure_ascii=False, indent=2, sort_keys=True)
          print("filtros tomados de main; resto de la config, de la rama estado")
          PY
          rm -f config.main.json

      - name: Preparar la rama de estado
        run: |
          git config user.name "radar-pokemon"
          git config user.email "radar@users.noreply.github.com"
          git checkout --orphan estado_nuevo
          git rm -rf --cached . > /dev/null

      - name: Bucle del radar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # El bucle va cada 2 minutos, pero eso NO es lo que se pregunta a
          # cada tienda: de eso manda `cada_min` en config.json. Amazon a 2
          # minutos seria pedir el bloqueo; CardZone, que es un JSON limpio sin
          # antibot, aguanta de sobra. El bucle rapido solo sirve para que cada
          # tienda se consulte en cuanto le toca, no diez minutos despues.
          INTERVALO=120
          FIN=$(( $(date -u +%s) + 350 * 60 ))
          ULTIMO_PUSH=0
          N=0

          while [ "$(date -u +%s)" -lt "$FIN" ]; do
            N=$((N + 1))
            echo "::group::pasada $N  $(date -u '+%H:%M:%S') UTC"
            # Una pasada que falle no puede cortar el bucle: la siguiente lo
            # reintenta dos minutos despues.
            python radar.py || echo "la pasada ha fallado, se sigue"
            echo "::endgroup::"

            # El estado se publica cada 5 minutos, no en cada vuelta: con el
            # bucle a 2 minutos serian mas de 2.000 push al dia y GitHub acaba
            # tratandolo como abuso. Cinco minutos es lo que como mucho se
            # pierde si GitHub corta el job, y eso solo retrasa un aviso.
            AHORA=$(date -u +%s)
            if [ -f estado.json ] && [ "$((AHORA - ULTIMO_PUSH))" -ge 300 ]; then
              git add -f estado.json config.json
              git commit -q -m "estado $(date -u '+%Y-%m-%d %H:%M UTC')" || true
              if git push -f -q origin estado_nuevo:estado; then
                ULTIMO_PUSH=$AHORA
              else
                echo "push fallido, se reintenta en la siguiente"
              fi
            fi

            [ "$(( $(date -u +%s) + INTERVALO ))" -lt "$FIN" ] || break
            sleep $INTERVALO
          done

          # Lo ultimo que se haya detectado no se queda sin publicar.
          if [ -f estado.json ]; then
            git add -f estado.json config.json
            git commit -q -m "estado final $(date -u '+%Y-%m-%d %H:%M UTC')" || true
            git push -f -q origin estado_nuevo:estado || true
          fi
          echo "fin del bucle: $N pasadas"

      # El cron de GitHub es la red de seguridad, no el motor: se salta la
      # mayoria de los arranques (hoy, los de las 06, 07 y 08). Las ejecuciones
      # lanzadas por API con workflow_dispatch no sufren ese descarte, asi que
      # cada job, al terminar, lanza el siguiente. Hace falta un token propio
      # (RADAR_PAT, fine-grained, permiso Actions: write) porque el GITHUB_TOKEN
      # de serie no puede disparar workflows, a proposito, para evitar bucles.
      # Si el secret no existe, no pasa nada: se sigue dependiendo del cron.
      - name: Encadenar la siguiente ejecucion
        if: always()
        env:
          PAT: ${{ secrets.RADAR_PAT }}
        run: |
          if [ -z "$PAT" ]; then echo "sin RADAR_PAT: la siguiente depende del cron"; exit 0; fi
          curl -s -o /dev/null -w "siguiente ejecucion lanzada: HTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer $PAT" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/radar.yml/dispatches" \
            -d '{"ref":"main"}'
