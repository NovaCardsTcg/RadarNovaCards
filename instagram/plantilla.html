<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Inter:wght@500;600;700;800&family=Permanent+Marker&display=block" rel="stylesheet" />
<style>
  /* Diapositiva de Instagram 1080x1350 (4:5). La pinta render.py con pinta(). */
  :root { --bg: #071827; --surface: #0e2235; --surface-2: #163049; --accent: #2eebe5; --text: #eaf6f8;
          --muted: #9db4c2; --oferta: #ff4545; --repo: #ffb020; --nuevo: #7c8cff; --blanco: #ffffff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }
  .lienzo { position: relative; width: 1080px; height: 1350px; overflow: hidden;
    background: radial-gradient(900px 700px at 85% 10%, rgba(46,235,229,.17), transparent 60%),
                radial-gradient(800px 800px at 0% 100%, rgba(46,235,229,.09), transparent 60%), var(--bg); }
  .cab { position: absolute; top: 48px; left: 64px; right: 64px; display: flex; align-items: center; gap: 16px; z-index: 5; }
  .cab img { width: 64px; height: 64px; }
  .marca { font-family: 'Baloo 2'; font-weight: 800; font-size: 40px; line-height: 1; }
  .caza { font-family: 'Permanent Marker'; color: var(--accent); font-size: 22px; margin-left: 10px; letter-spacing: 2px; }
  .num { margin-left: auto; font-weight: 700; color: var(--muted); font-size: 26px; }
  .pie { position: absolute; left: 64px; right: 64px; bottom: 40px; display: flex; justify-content: space-between;
         color: var(--muted); font-size: 22px; font-weight: 600; }
  .pie b { color: var(--accent); }
  em { font-style: normal; color: var(--accent); }

  /* Portada */
  .portada .texto { position: absolute; left: 64px; right: 64px; top: 170px; }
  .etiqueta { display: inline-block; background: rgba(46,235,229,.14); color: var(--accent); font-weight: 700; font-size: 30px;
    padding: 10px 24px; border-radius: 999px; margin-bottom: 24px; }
  .portada h1 { font-family: 'Baloo 2'; font-weight: 800; font-size: 92px; line-height: 1.0; letter-spacing: -1px; }
  .portada p { margin-top: 20px; font-size: 34px; line-height: 1.35; color: var(--muted); font-weight: 500; }
  .portada p b { color: var(--text); white-space: nowrap; }
  .abanico { position: absolute; left: 0; right: 0; bottom: 110px; height: 560px; }
  .abanico .f { position: absolute; bottom: 0; width: 380px; height: 470px; left: 50%; border-radius: 36px; background: var(--blanco);
    box-shadow: 0 30px 80px rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .abanico .f img { max-width: 88%; max-height: 88%; object-fit: contain; }
  .abanico.cartas .f { background: transparent; box-shadow: none; width: 340px; height: 475px; }
  .abanico.cartas .f img { max-width: 100%; max-height: 100%; border-radius: 18px; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  .abanico .f0 { transform: translateX(-50%) translateX(-270px) rotate(-11deg); bottom: -10px; }
  .abanico .f1 { transform: translateX(-50%); z-index: 2; bottom: 30px; }
  .abanico .f2 { transform: translateX(-50%) translateX(270px) rotate(11deg); bottom: -10px; }
  .logo-col { position: absolute; right: 64px; top: 150px; max-width: 300px; max-height: 120px; }

  /* Producto */
  .producto .foto { position: absolute; left: 64px; right: 64px; top: 140px; height: 750px; background: var(--blanco);
    border-radius: 44px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .producto .foto img { max-width: 86%; max-height: 86%; object-fit: contain; }
  .dto { position: absolute; top: 116px; right: 40px; z-index: 4; background: var(--oferta); color: var(--blanco); font-family: 'Baloo 2';
    font-weight: 800; font-size: 76px; line-height: 1; padding: 22px 30px 12px; border-radius: 30px; transform: rotate(6deg);
    box-shadow: 0 18px 40px rgba(0,0,0,.4); }
  .aviso { position: absolute; top: 170px; left: 96px; z-index: 4; font-weight: 800; font-size: 28px; padding: 10px 22px;
    border-radius: 999px; color: var(--bg); }
  .aviso.reposicion { background: var(--repo); } .aviso.nuevo { background: var(--nuevo); color: var(--blanco); }
  .aviso.bajada { background: var(--accent); }
  .producto .info { position: absolute; left: 64px; right: 64px; top: 925px; }
  .producto h2 { font-size: 44px; line-height: 1.18; font-weight: 700; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .fila { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 28px; gap: 24px; }
  .tienda { display: flex; align-items: center; gap: 16px; font-size: 32px; font-weight: 700; color: var(--muted); min-width: 0; }
  .tienda img { width: 64px; height: 64px; border-radius: 16px; background: var(--blanco); object-fit: contain; padding: 4px; }
  .precio { text-align: right; white-space: nowrap; }
  .precio .ya { font-family: 'Baloo 2'; font-weight: 800; font-size: 104px; line-height: .9; color: var(--accent); }
  .precio .antes { font-size: 34px; color: var(--muted); text-decoration: line-through; font-weight: 600; }

  /* Carta */
  .carta .img { position: absolute; left: 50%; top: 140px; transform: translateX(-50%); height: 800px; }
  .carta .img img { height: 800px; border-radius: 28px; box-shadow: 0 40px 100px rgba(0,0,0,.6), 0 0 80px rgba(46,235,229,.15); }
  .carta .info { position: absolute; left: 64px; right: 64px; top: 975px; text-align: center; }
  .carta h2 { font-family: 'Baloo 2'; font-weight: 800; font-size: 66px; line-height: 1; }
  .carta .col { margin-top: 10px; font-size: 30px; color: var(--muted); font-weight: 600; }
  .carta .ya { margin-top: 18px; font-family: 'Baloo 2'; font-weight: 800; font-size: 100px; line-height: .95; color: var(--accent); }
  .carta .extra { font-size: 30px; font-weight: 700; color: var(--text); }

  /* Lanzamiento */
  .lanzamiento .caja { position: absolute; left: 64px; right: 64px; top: 220px; bottom: 140px; background: var(--surface);
    border: 3px solid var(--surface-2); border-radius: 48px; padding: 64px; display: flex; flex-direction: column; }
  .lanzamiento .juego { font-size: 32px; color: var(--accent); font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
  .lanzamiento h2 { margin-top: 18px; font-family: 'Baloo 2'; font-weight: 800; font-size: 96px; line-height: 1; }
  .lanzamiento .cod { margin-top: 12px; font-size: 36px; color: var(--muted); font-weight: 700; }
  .lanzamiento .fecha { margin-top: auto; font-family: 'Baloo 2'; font-weight: 800; font-size: 64px; line-height: 1.05; }
  .lanzamiento .cuenta { margin-top: 18px; display: inline-block; align-self: flex-start; background: var(--accent); color: var(--bg);
    font-weight: 800; font-size: 40px; padding: 12px 30px; border-radius: 999px; }
  .lanzamiento ul { margin-top: 40px; list-style: none; font-size: 32px; color: var(--muted); line-height: 1.5; }
  .lanzamiento li::before { content: '★ '; color: var(--accent); }

  /* Cifras */
  .cifras .texto { position: absolute; left: 64px; right: 64px; top: 190px; }
  .cifras h1 { font-family: 'Baloo 2'; font-weight: 800; font-size: 110px; line-height: 1; }
  .cifras .lista { margin-top: 70px; display: flex; flex-direction: column; gap: 28px; }
  .cifras .c { display: flex; align-items: center; gap: 28px; background: var(--surface); border: 3px solid var(--surface-2);
    border-radius: 36px; padding: 34px 44px; font-size: 42px; font-weight: 700; }
  .cifras .c span:last-child { margin-left: auto; font-family: 'Baloo 2'; font-weight: 800; font-size: 80px; color: var(--accent); line-height: 1; }

  /* Publicidad de la app: moviles con capturas */
  .movil { position: absolute; left: 50%; border-radius: 56px; padding: 14px; background: #02080e;
    box-shadow: 0 40px 110px rgba(0,0,0,.65), 0 0 0 3px #1d3a52, 0 0 90px rgba(46,235,229,.16); }
  .movil img { display: block; width: 100%; border-radius: 44px; }
  .app-portada .texto { position: absolute; left: 64px; right: 64px; top: 165px; }
  .app-portada h1 { font-family: 'Baloo 2'; font-weight: 800; font-size: 86px; line-height: 1.0; letter-spacing: -1px; }
  .app-portada p { margin-top: 16px; font-size: 32px; color: var(--muted); font-weight: 500; }
  .app-portada .movil { width: 340px; top: 640px; }
  .app-portada .m0 { transform: translateX(-50%) translateX(-280px) rotate(-8deg); top: 690px; }
  .app-portada .m1 { transform: translateX(-50%); z-index: 2; }
  .app-portada .m2 { transform: translateX(-50%) translateX(280px) rotate(8deg); top: 690px; }
  .paso .texto { position: absolute; left: 64px; right: 64px; top: 145px; }
  .paso h2 { font-family: 'Baloo 2'; font-weight: 800; font-size: 74px; line-height: 1.02; }
  .paso p { margin-top: 10px; font-size: 34px; line-height: 1.3; color: var(--muted); font-weight: 500; }
  .paso .movil { width: 560px; top: 410px; transform: translateX(-50%); }
  .paso .pie, .app-portada .pie { z-index: 6; left: 0; right: 0; bottom: 0; padding: 70px 64px 36px;
    background: linear-gradient(transparent, var(--bg) 62%); }

  /* Llamada final */
  .final { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 80px; }
  .final img { width: 220px; height: 220px; margin-bottom: 30px; filter: drop-shadow(0 0 60px rgba(46,235,229,.35)); }
  .final h1 { font-family: 'Baloo 2'; font-weight: 800; font-size: 84px; line-height: 1.02; }
  .url { margin-top: 44px; font-family: 'Baloo 2'; font-weight: 800; font-size: 72px; color: var(--bg); background: var(--accent); padding: 8px 52px; border-radius: 28px; }
  .tg { margin-top: 28px; font-size: 38px; font-weight: 700; }
  .tg span { color: var(--accent); }
  .gratis { margin-top: 18px; font-size: 30px; color: var(--muted); }
</style>
</head>
<body>
<div class="lienzo" id="lienzo"></div>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const AVISO = { nuevo: '🆕 Nuevo', reposicion: '🔄 Reposición', bajada: '📉 Baja de precio' }
// El titulo de la portada trae <em> a proposito (lo escribe contenido.py, no viene de fuera).
const conEm = (s) => esc(s).replace(/&lt;(\/?)em&gt;/g, '<$1em>')

function pinta(d, n, total, fecha) {
  const cab = `<div class="cab"><img src="icono.svg"><span class="marca">Cromel<span class="caza">CAZA TCG</span></span><span class="num">${n}/${total}</span></div>`
  const pie = (txt) => `<div class="pie"><span>${txt}</span><b>cromeltcg.com</b></div>`
  let h = ''
  if (d.tipo === 'portada') {
    const imgs = (d.imagenes || []).filter(Boolean)
    const orden = imgs.length === 3 ? [imgs[1], imgs[0], imgs[2]] : imgs
    const fan = orden.map((u, i) => `<div class="f f${imgs.length === 1 ? 1 : (imgs.length === 2 ? i * 2 : i)}"><img src="${u}"></div>`).join('')
    h = `<div class="portada">${cab}${d.logo ? `<img class="logo-col" src="${d.logo}">` : ''}
      <div class="texto"><span class="etiqueta">${esc(d.etiqueta)}</span><h1>${conEm(d.titulo)}</h1><p>${conEm(d.sub).replace(/&lt;(\/?)b&gt;/g, '<$1b>')}</p></div>
      <div class="abanico ${d.cartas ? 'cartas' : ''}">${fan}</div>${pie(fecha)}</div>`
  } else if (d.tipo === 'producto') {
    h = `<div class="producto">${cab}
      <div class="foto"><img src="${d.imagen}"></div>
      ${d.descuento ? `<div class="dto">-${d.descuento}%</div>` : ''}
      <span class="aviso ${d.aviso}">${AVISO[d.aviso] || ''}</span>
      <div class="info"><h2>${esc(d.titulo)}</h2>
        <div class="fila"><div class="tienda">${d.tienda_logo ? `<img src="${d.tienda_logo}">` : ''}<span>${esc(d.tienda)}</span></div>
        <div class="precio">${d.antes ? `<div class="antes">${esc(d.antes)}</div>` : ''}<div class="ya">${esc(d.precio)}</div></div></div></div>
      ${pie('Precio visto el ' + fecha + ' · puede cambiar')}</div>`
  } else if (d.tipo === 'carta') {
    h = `<div class="carta">${cab}<div class="img"><img src="${d.imagen}"></div>
      <div class="info"><h2>${esc(d.nombre)}</h2><div class="col">${esc(d.coleccion)}</div>
      <div class="ya">${esc(d.precio)}</div><div class="extra">${esc(d.extra)}</div></div>
      ${pie('Precio de mercado · ' + fecha)}</div>`
  } else if (d.tipo === 'lanzamiento') {
    h = `<div class="lanzamiento">${cab}<div class="caja"><div class="juego">${esc(d.juego)}</div><h2>${esc(d.nombre)}</h2>
      ${d.codigo ? `<div class="cod">${esc(d.codigo)}</div>` : ''}
      ${(d.destacadas || []).length ? `<ul>${d.destacadas.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
      <div class="fecha">${esc(d.fecha)}</div><span class="cuenta">${esc(d.cuenta)}</span></div>
      ${pie('Fechas en España')}</div>`
  } else if (d.tipo === 'cifras') {
    h = `<div class="cifras">${cab}<div class="texto"><span class="etiqueta">${esc(d.etiqueta)}</span><h1>${conEm(d.titulo)}</h1>
      <div class="lista">${d.filas.map((f) => `<div class="c"><span>${f[0]}</span><span>${esc(f[1])}</span><span>${f[2]}</span></div>`).join('')}</div></div>
      ${pie('Últimos 7 días')}</div>`
  } else if (d.tipo === 'app_portada') {
    const m = d.capturas.map((u, i) => `<div class="movil m${[1, 0, 2][i]}"><img src="${u}"></div>`).join('')
    h = `<div class="app-portada">${cab}<div class="texto"><span class="etiqueta">${esc(d.etiqueta)}</span><h1>${conEm(d.titulo)}</h1><p>${esc(d.sub)}</p></div>
      ${m}${pie('Imágenes de ejemplo de la app')}</div>`
  } else if (d.tipo === 'paso') {
    h = `<div class="paso">${cab}<div class="texto"><h2>${esc(d.titulo)}</h2><p>${esc(d.texto)}</p></div>
      <div class="movil"><img src="${d.captura}"></div>${pie('Imagen de ejemplo de la app')}</div>`
  } else {
    h = `<div class="final"><img src="icono.svg"><h1>${d.titulo ? conEm(d.titulo) : 'Todas las ofertas, <em>al momento</em>'}</h1>
      <div class="url">cromeltcg.com</div><div class="tg">Avisos en Telegram <span>@cromeltcg</span></div>
      <div class="gratis">${d.pide ? esc(d.pide) : 'Gratis y sin descargas · enlace en la bio'}</div></div>`
  }
  document.getElementById('lienzo').innerHTML = h
  const imgs = [...document.images]
  return Promise.all(imgs.map((i) => i.complete ? null : new Promise((r) => { i.onload = i.onerror = r })))
    .then(() => document.fonts.ready)
    .then(() => imgs.filter((i) => !i.naturalWidth).map((i) => i.src.slice(0, 80)))
}
</script>
</body>
</html>
